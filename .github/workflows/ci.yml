name: CI — Unit Tests, Security & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Compilación y pruebas unitarias xUnit
  # ─────────────────────────────────────────────
  unit-tests:
    name: xUnit Tests — EcomifyCustomers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/EcomifyCustomers.Tests/EcomifyCustomers.Tests.csproj

      - name: Build
        run: dotnet build tests/EcomifyCustomers.Tests/EcomifyCustomers.Tests.csproj --no-restore -c Release

      - name: Run xUnit tests
        run: |
          dotnet test tests/EcomifyCustomers.Tests/EcomifyCustomers.Tests.csproj \
            --no-build \
            -c Release \
            --logger "trx;LogFileName=results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ecomify-customers
          path: TestResults/

  # ─────────────────────────────────────────────
  # JOB 2: Análisis de vulnerabilidades con Snyk
  # ─────────────────────────────────────────────
  snyk-security:
    name: Snyk — Vulnerability Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcomifyCustomers/EcomifyCustomers.csproj

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=EcomifyCustomers/EcomifyCustomers.csproj

      - name: Upload Snyk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 3: Análisis estático con SonarCloud
  # ─────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud — Static Analysis
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore EcomifyCustomers/EcomifyCustomers.csproj

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"EstebanGarayCano_Actividad_Fundamentos_DevOps" \
            /o:"estebangaraycano" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"

      - name: Build for analysis
        run: dotnet build EcomifyCustomers/EcomifyCustomers.csproj -c Release --no-restore

      - name: Run tests for coverage
        run: |
          dotnet test tests/EcomifyCustomers.Tests/EcomifyCustomers.Tests.csproj \
            -c Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.xml

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
