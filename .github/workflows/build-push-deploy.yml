# Build y push de imágenes a Google Artifact Registry (linux/amd64)
# Proyecto: project-54ecee29-e768-42f3-977
# Registry:  us-central1-docker.pkg.dev/.../devops-repo
# Auth:      Workload Identity Federation (sin claves JSON)

name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: project-54ecee29-e768-42f3-977
  GCP_REGION: us-central1
  AR_REPO: devops-repo
  PLATFORM: linux/amd64
  WIF_PROVIDER: projects/1090134414741/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-actions-sa@project-54ecee29-e768-42f3-977.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build and push images to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push EcomifyCustomers
        run: |
          docker build --platform ${{ env.PLATFORM }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/ecomify-customers:latest \
            -f EcomifyCustomers/Dockerfile EcomifyCustomers
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/ecomify-customers:latest

      - name: Build and push Backend
        run: |
          docker build --platform ${{ env.PLATFORM }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend:latest \
            -f Backend/Dockerfile Backend
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend:latest

      - name: Build and push Productos
        run: |
          docker build --platform ${{ env.PLATFORM }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/productos:latest \
            -f Productos/Dockerfile Productos
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/productos:latest

      - name: Build and push Frontend
        run: |
          docker build --platform ${{ env.PLATFORM }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest \
            -f Frontend/Dockerfile Frontend
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest

  deploy:
    name: Deploy to GKE
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.GKE_CLUSTER_NAME != '' }}
    env:
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_ZONE: ${{ vars.GKE_ZONE || 'us-central1' }}
      GKE_NAMESPACE: default
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Rollout restart deployments
        run: |
          kubectl rollout restart deployment/ecomify-customers deployment/backend deployment/frontend deployment/productos -n ${{ env.GKE_NAMESPACE }}
          kubectl rollout status deployment/ecomify-customers deployment/backend deployment/frontend deployment/productos -n ${{ env.GKE_NAMESPACE }} --timeout=300s
